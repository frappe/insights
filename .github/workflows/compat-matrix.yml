name: Frappe Compatibility Matrix

on:
  schedule:
    # Daily at 02:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  # Every release is a push to version-3, so the PRs that feed it must install on both Frappe versions
  pull_request:
    branches: [version-3]

concurrency:
  group: compat-matrix-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A pull request leaves insights_branch empty, so checkout takes the PR's own code.
        # main is Insights v2, which never targeted Frappe v16. develop builds against the
        # frappe app's `ui/`, which only Frappe develop ships.
        # dependencies: highest upgrades Insights' dependencies to the newest versions both
        # apps allow, which a site gets once another app or a later deploy upgrades them.
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"frappe_branch": "version-15"}, {"frappe_branch": "version-16"}]'
          || '[{"insights_branch": "main", "frappe_branch": "version-15"},
          {"insights_branch": "version-3", "frappe_branch": "version-15"},
          {"insights_branch": "version-3", "frappe_branch": "version-16"},
          {"insights_branch": "develop", "frappe_branch": "develop"},
          {"insights_branch": "version-3", "frappe_branch": "version-15", "dependencies": "highest"},
          {"insights_branch": "version-3", "frappe_branch": "version-16", "dependencies": "highest"},
          {"insights_branch": "develop", "frappe_branch": "develop", "dependencies": "highest"}]') }}

    name: Install (Insights=${{ matrix.insights_branch || github.head_ref }}, Frappe=${{ matrix.frappe_branch }}${{ matrix.dependencies && format(', Dependencies={0}', matrix.dependencies) || '' }})

    services:
      mariadb:
        # Each Frappe branch runs the MariaDB, Python and Node its own CI runs
        image: mariadb:${{ matrix.frappe_branch == 'version-15' && '10.6' || '11.8' }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

      # bench keeps the default redis hosts even when it skips config
      # generation, so these ports must answer. Frappe v16 raises a redis
      # connection error where v15 only warns.
      redis-cache:
        image: redis:8-alpine
        ports:
          - 13000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5

      redis-queue:
        image: redis:8-alpine
        ports:
          - 11000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5

    env:
      BENCH_PATH: /home/runner/frappe-bench
      SITE_NAME: test_site
      DB_ROOT_PASSWORD: root
      ADMIN_PASSWORD: admin

    steps:
      - name: Checkout Insights
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.insights_branch }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.frappe_branch == 'version-15' && '3.10' || '3.14' }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.frappe_branch == 'version-15' && '18' || '24' }}

      - name: Install bench
        run: |
          pip install frappe-bench

      - name: Init bench with Frappe ${{ matrix.frappe_branch }}
        run: |
          bench init \
            --frappe-branch ${{ matrix.frappe_branch }} \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            "$BENCH_PATH"
          mysql --host 127.0.0.1 --port 3306 -u root -p"$DB_ROOT_PASSWORD" -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -p"$DB_ROOT_PASSWORD" -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install Insights
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          # Install the checked-out Insights code into the bench
          bench get-app insights "$GITHUB_WORKSPACE"

          # Install requirements
          bench setup requirements

      - name: Upgrade dependencies to highest allowed
        if: ${{ matrix.dependencies == 'highest' }}
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          # Naming the packages next to both apps resolves them against both
          # apps' ranges at once, so a range no version satisfies fails here.
          packages=$(./env/bin/python -c "
          import re
          from importlib.metadata import requires
          print(' '.join(sorted({re.match(r'[A-Za-z0-9._-]+', r).group() for r in requires('insights')})))
          ")
          ./env/bin/python -m pip install --upgrade -e apps/frappe -e apps/insights $packages

      - name: Check dependency conflicts
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          # bench installs one app at a time, so pip only warns when two apps'
          # ranges disagree. Fail on the conflicts that involve Insights.
          ./env/bin/python - <<'EOF'
          import re
          import subprocess
          import sys
          from importlib.metadata import requires

          def canonical(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          insights_packages = {canonical(re.match(r"[A-Za-z0-9._-]+", r).group()) for r in requires("insights")}
          output = subprocess.run(
              [sys.executable, "-m", "pip", "check"], capture_output=True, text=True
          ).stdout
          print(output)

          conflicts = []
          for line in output.splitlines():
              match = re.match(r"(\S+) \S+ (?:has requirement|requires) ([A-Za-z0-9._-]+)", line)
              if match and (canonical(match[1]) == "insights" or canonical(match[2]) in insights_packages):
                  conflicts.append(line)

          if conflicts:
              print("Conflicts involving Insights:", *conflicts, sep="\n")
              sys.exit(1)
          EOF

      - name: Import Insights modules
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          # The tests import a few modules. A dependency release that moves a
          # module Insights imports only fails when that module is imported.
          ./env/bin/python - <<'EOF'
          import importlib
          import sys
          from pathlib import Path

          import insights

          root = Path(insights.__file__).parent
          failures = []
          for path in sorted(root.rglob("*.py")):
              relative = path.relative_to(root.parent).with_suffix("")
              if any(part in ("tests", "public", "node_modules", "__main__") or part.startswith("test_") for part in relative.parts):
                  continue
              module = ".".join(relative.parts).removesuffix(".__init__")
              try:
                  importlib.import_module(module)
              except ImportError as e:
                  failures.append(f"{module}: {e}")
              except Exception:
                  # Modules that need a site or request fail here for reasons unrelated to dependencies
                  pass

          if failures:
              print("Modules that fail to import:", *failures, sep="\n")
              sys.exit(1)
          EOF

      - name: Create Site and Run Tests
        working-directory: ${{ env.BENCH_PATH }}
        env:
          CI: "Yes"
        run: |
          bench new-site "$SITE_NAME" \
            --db-root-password "$DB_ROOT_PASSWORD" \
            --admin-password "$ADMIN_PASSWORD"
          bench --site "$SITE_NAME" install-app insights
          bench --site "$SITE_NAME" run-tests --app insights --module insights.tests.test_basic_workflow

  report-failure:
    name: Report failure
    needs: install-matrix
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      # A scheduled run has no reviewer. Without this the matrix stays red
      # unnoticed, which it did for a week.
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create compat-matrix \
            --repo "$GITHUB_REPOSITORY" \
            --description "Nightly Frappe compatibility matrix" \
            --color d73a4a \
            --force

          # One line per failed job, saying what breaks on sites if it ships
          failures=$(gh run view "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json jobs \
            --jq '.jobs[]
              | select(.conclusion == "failure" and (.name | startswith("Install")))
              | . as $job
              | ([.steps[] | select(.conclusion == "failure") | .name][0] // "unknown step") as $step
              | "- **\($job.name)** failed at `\($step)`. " + (
                  if $step == "Check dependency conflicts" or $step == "Upgrade dependencies to highest allowed" then
                    "Insights and Frappe allow versions of a package that no release satisfies both. Sites that update either app install the version one of them rejects, and break at import or migrate. Relax the Insights range and release before this Frappe version reaches sites."
                  elif $step == "Import Insights modules" then
                    "Insights code fails to import on the dependency versions this leg installed. Sites that install these versions break when the module loads. Fix the import, or cap the version and release."
                  elif $step == "Create Site and Run Tests" and ($job.name | contains("Dependencies=highest")) then
                    "Insights breaks on the newest versions its dependency ranges allow. Sites get these versions when another app or a later deploy upgrades them. Fix the code, or cap the version and release."
                  else
                    "Insights does not install or pass its tests on this Frappe branch."
                  end
                )')

          body=$(printf '%s\n\nRun: %s' "$failures" "$RUN_URL")

          existing=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label compat-matrix \
            --limit 1 \
            --json number \
            --jq '.[0].number')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nightly compatibility matrix is failing" \
              --label compat-matrix \
              --body "$body"
          fi
