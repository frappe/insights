name: Frappe Compatibility Matrix

on:
  schedule:
    # Daily at 02:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: compat-matrix-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        insights_branch: [main, version-3, develop]
        frappe_branch: [version-15, version-16]
        exclude:
          # main is Insights v2, which never targeted Frappe v16
          - insights_branch: main
            frappe_branch: version-16

    name: Install (Insights=${{ matrix.insights_branch }}, Frappe=${{ matrix.frappe_branch }})

    services:
      mariadb:
        # Each Frappe branch runs the MariaDB its own CI runs
        image: mariadb:${{ matrix.frappe_branch == 'version-16' && '11.8' || '10.6' }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

      # bench keeps the default redis hosts even when it skips config
      # generation, so these ports must answer. Frappe v16 raises a redis
      # connection error where v15 only warns.
      redis-cache:
        image: redis:8-alpine
        ports:
          - 13000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5

      redis-queue:
        image: redis:8-alpine
        ports:
          - 11000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5

    env:
      BENCH_PATH: /home/runner/frappe-bench
      SITE_NAME: test_site
      DB_ROOT_PASSWORD: root
      ADMIN_PASSWORD: admin

    steps:
      - name: Checkout Insights
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.insights_branch }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.frappe_branch == 'version-16' && '3.14' || '3.10' }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.frappe_branch == 'version-16' && '24' || '20' }}

      - name: Install bench
        run: |
          pip install frappe-bench

      - name: Init bench with Frappe ${{ matrix.frappe_branch }}
        run: |
          bench init \
            --frappe-branch ${{ matrix.frappe_branch }} \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            "$BENCH_PATH"
          mysql --host 127.0.0.1 --port 3306 -u root -p"$DB_ROOT_PASSWORD" -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -p"$DB_ROOT_PASSWORD" -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Create Site, Install Insights, and Run Tests
        working-directory: ${{ env.BENCH_PATH }}
        env:
          CI: "Yes"
        run: |
          # Install the checked-out Insights code into the bench
          bench get-app insights "$GITHUB_WORKSPACE"

          # Install requirements
          bench setup requirements

          # Create site and install Insights
          bench new-site "$SITE_NAME" \
            --db-root-password "$DB_ROOT_PASSWORD" \
            --admin-password "$ADMIN_PASSWORD"
          bench --site "$SITE_NAME" install-app insights
          bench --site "$SITE_NAME" run-tests --app insights --module insights.tests.test_basic_workflow

  report-failure:
    name: Report failure
    needs: install-matrix
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # A scheduled run has no reviewer. Without this the matrix stays red
      # unnoticed, which it did for a week.
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create compat-matrix \
            --repo "$GITHUB_REPOSITORY" \
            --description "Nightly Frappe compatibility matrix" \
            --color d73a4a \
            --force

          existing=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label compat-matrix \
            --limit 1 \
            --json number \
            --jq '.[0].number')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Still failing: $RUN_URL"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nightly compatibility matrix is failing" \
              --label compat-matrix \
              --body "The nightly compatibility matrix failed. Run: $RUN_URL"
          fi
