name: Server

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Later patterns override earlier ones. Server tests read the island entries
    # from assets.json, and some read `.ts` sources: translatable labels, the
    # filter picker's operators, client escaping.
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '!frontend/**'
      - 'frontend/build-islands.mjs'
      - 'frontend/src2/**/*.ts'
      - 'frontend/src2/**/*.tsx'
  workflow_dispatch:
  schedule:
    # Run everday at midnight UTC / 5:30 IST
    - cron: "0 0 * * *"

concurrency:
  group: server-${{ github.event_name }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    # A scheduled run on a develop that has not moved since the last green one
    # would repeat that run. One API call here is cheaper than the bench.
    name: New commits
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          echo "Last green scheduled run: ${last:-none}. Now: $GITHUB_SHA."
          echo "run=$([ "$last" = "$GITHUB_SHA" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  tests:
    needs: changed
    # `!cancelled()` so the tests run when `changed` is skipped, as it is off schedule.
    if: >-
      !cancelled() && needs.changed.outputs.run != 'false' &&
      !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server
    env:
      BENCH_PATH: /home/runner/frappe-bench
      SITE_NAME: test_site
      DB_ROOT_PASSWORD: root
      ADMIN_PASSWORD: admin
      FRAPPE_BRANCH: develop

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -q -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install system dependencies
        run: |
          sudo apt -qq update
          sudo apt -qq install -y redis-server

      - name: Setup
        run: |
          pip install frappe-bench
          bench init \
            --frappe-branch "$FRAPPE_BRANCH" \
            --skip-assets \
            --python "$(which python)" \
            "$BENCH_PATH"
          mysql --host 127.0.0.1 --port 3306 -u root -p"$DB_ROOT_PASSWORD" -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -p"$DB_ROOT_PASSWORD" -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          bench get-app insights $GITHUB_WORKSPACE --skip-assets
          bench setup requirements --dev
          bench config set-common-config -c server_script_enabled 1
          bench new-site --db-root-password "$DB_ROOT_PASSWORD" --admin-password "$ADMIN_PASSWORD" "$SITE_NAME"
          bench --site "$SITE_NAME" install-app insights
          # yarn caches every frappe-ui commit as 1.0.2, so Frappe would reuse Insights' pin
          yarn cache clean frappe-ui
          bench build
        env:
          CI: "Yes"

      - name: Start Bench Services
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          sed -i '/^watch:/d' Procfile
          sed -i '/^schedule:/d' Procfile
          sed -i '/^socketio:/d' Procfile
          bench start &> bench_start.log &

      - name: Run Tests
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          bench --site "$SITE_NAME" set-config allow_tests 1 --parse
          env/bin/python apps/insights/.github/helpers/run_backend_tests.py --site "$SITE_NAME"
        env:
          TYPE: server

      # In this job, not a job of its own: each job takes a runner from the frappe
      # org's shared pool, and waits in its queue.
      - name: Upload coverage data
        uses: codecov/codecov-action@v6
        with:
          name: Server
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.BENCH_PATH }}/sites/coverage.xml
          fail_ci_if_error: true
          verbose: true
          flags: server
