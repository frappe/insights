name: Server

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Later patterns override earlier ones. Server tests read the island entries
    # from assets.json, and some read `.ts` sources: translatable labels, the
    # filter picker's operators, client escaping.
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '!frontend/**'
      - 'frontend/build-islands.mjs'
      - 'frontend/src2/**/*.ts'
      - 'frontend/src2/**/*.tsx'
  workflow_dispatch:
  schedule:
    # Run everday at midnight UTC / 5:30 IST
    - cron: "0 0 * * *"

concurrency:
  group: server-${{ github.event_name }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    # A scheduled run on a develop that has not moved since the last green one
    # would repeat that run. One API call here is cheaper than the bench.
    name: New commits
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          echo "Last green scheduled run: ${last:-none}. Now: $GITHUB_SHA."
          echo "run=$([ "$last" = "$GITHUB_SHA" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  tests:
    needs: changed
    # `!cancelled()` so the tests run when `changed` is skipped, as it is off schedule.
    if: >-
      !cancelled() && needs.changed.outputs.run != 'false' &&
      !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server
    env:
      BENCH_PATH: /home/runner/pilot/benches/frappe-bench
      SITE_NAME: test_site
      DB_ROOT_PASSWORD: root
      ADMIN_PASSWORD: admin
      FRAPPE_BRANCH: version-16

    services:
      mariadb:
        # Frappe version-16 runs its own CI on 11.8, and a uuid `name` needs 10.7 or later
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -q -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip and uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Setup Pilot
        run: |
          curl -fsSL https://raw.githubusercontent.com/frappe/pilot/develop/install.sh | sh -s -- --ci
          export PATH="$HOME/pilot/bin:$HOME/.local/bin:$PATH"
          printf '%s\n' "$HOME/pilot/bin" "$HOME/.local/bin" >> "$GITHUB_PATH"
          pilot new frappe-bench --frappe-branch "$FRAPPE_BRANCH"
          pilot -b frappe-bench set-bench-config admin_allow_site_to_pilot_communication false
          pilot -b frappe-bench set-bench-config mariadb_existing true
          pilot -b frappe-bench set-bench-config mariadb_host 127.0.0.1
          pilot -b frappe-bench set-bench-config mariadb_port 3306
          pilot -b frappe-bench set-bench-config mariadb_admin_user root
          pilot -b frappe-bench set-bench-config mariadb_password "$DB_ROOT_PASSWORD"
          pilot -b frappe-bench init --skip-frontend
          # The external MariaDB service has no utf8mb4 defaults; Frappe needs them.
          printf '[client]\nskip-ssl\n' > ~/.my.cnf
          mariadb --host 127.0.0.1 --port 3306 -u root -p"$DB_ROOT_PASSWORD" -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -p"$DB_ROOT_PASSWORD" -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install Insights
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          uv pip install --python env/bin/python -e "apps/frappe[test]"
          pilot get-app "$GITHUB_WORKSPACE" --branch "$GITHUB_SHA" --skip-assets
          uv pip install --python env/bin/python -e "apps/insights[test]"
        env:
          CI: "Yes"

      - name: Build Islands
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          # Server tests check the island entries in assets.json without needing the full SPA build.
          yarn --cwd apps/insights/frontend install --frozen-lockfile
          yarn --cwd apps/insights/frontend build:islands

      - name: Start Pilot
        run: |
          pilot -b frappe-bench start > "$RUNNER_TEMP/pilot.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:7000/api/v1/health

      - name: Create Test Site
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          pilot frappe set-config -g -p server_script_enabled 1
          pilot new-site "$SITE_NAME" --admin-password "$ADMIN_PASSWORD" --apps frappe insights --skip-assets

      - name: Run Tests
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          pilot frappe --site "$SITE_NAME" set-config allow_tests 1 --parse
          env/bin/python apps/insights/.github/helpers/run_backend_tests.py --site "$SITE_NAME"
        env:
          TYPE: server

      # In this job, not a job of its own: each job takes a runner from the frappe
      # org's shared pool, and waits in its queue.
      - name: Upload coverage data
        uses: codecov/codecov-action@v6
        with:
          name: Server
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.BENCH_PATH }}/sites/coverage.xml
          fail_ci_if_error: true
          verbose: true
          flags: server

      - name: Show Pilot logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/pilot.log" || true
