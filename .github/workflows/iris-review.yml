name: iris — PR review

on:
  pull_request:
    # No `synchronize` — a re-review on every push gets cancelled by the next
    # push. Use `/iris review` in a comment after pushing fixes.
    types: [opened, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to (re)review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  # For the reaction on the /iris review comment.
  issues: write

jobs:
  review:
    # Kill switch: set repo variable IRIS_ENABLED=true to enable.
    # Fork PRs are skipped — secrets are not available in a fork context, so a
    # maintainer runs `/iris review` on those instead.
    if: >-
      vars.IRIS_ENABLED == 'true' && (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          github.event.issue.state == 'open' &&
          (
            github.event.comment.body == '/iris' ||
            startsWith(github.event.comment.body, '/iris ')
          ) &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        )
      )
    # On the job, not the workflow. Every comment on a PR starts a run, and a
    # workflow-level group makes that run cancel a review in flight — even when
    # its own job is skipped. A skipped job never enters a job-level group.
    concurrency:
      group: iris-${{ github.event_name == 'pull_request' && 'auto' || 'manual' }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve PR number
        # First step, so a failure in any later step still reports to the PR.
        id: pr
        env:
          DISPATCH: ${{ inputs.pr_number }}
          FROM_PR: ${{ github.event.pull_request.number }}
          FROM_ISSUE: ${{ github.event.issue.number }}
        run: echo "number=${DISPATCH:-${FROM_PR:-$FROM_ISSUE}}" >> "$GITHUB_OUTPUT"

      - name: Bot token
        # Optional custom identity: register a GitHub App, install it on this
        # repo, then set the IRIS_APP_ID variable and IRIS_APP_PRIVATE_KEY
        # secret. Without them iris acts as github-actions.
        id: bot
        if: vars.IRIS_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.IRIS_APP_ID }}
          private-key: ${{ secrets.IRIS_APP_PRIVATE_KEY }}

      - name: Acknowledge
        # An eyes reaction on the /iris review comment: seen, running.
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
        run: >-
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions
          -f content=eyes

      - uses: actions/checkout@v4
        with:
          # issue_comment and workflow_dispatch check out the default branch by
          # default; the head ref exists in the base repo for fork PRs too.
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          # History so iris can inspect recent commits near the changed files.
          fetch-depth: 200

      - name: Fetch develop
        # For git merge-base and three-dot diffs against the target branch.
        run: git fetch --depth=200 origin develop:refs/remotes/origin/develop

      - name: Use trusted agent config
        # The checkout is the PR head, so a fork PR controls every file in it —
        # including the command's allowed-tools and CLAUDE.md. Restore the agent
        # config from the ref this workflow file ran from: develop on
        # issue_comment, the dispatched branch on workflow_dispatch, and the
        # merge commit on pull_request (same-repo authors only).
        run: |
          git fetch --depth=1 origin ${{ github.sha }}
          rm -rf .claude .mcp.json CLAUDE.md AGENTS.md
          git checkout ${{ github.sha }} -- .claude CLAUDE.md AGENTS.md

      - name: Save comment
        # The agent cannot read env vars — its Bash permissions deny variable
        # expansion. Files reach it through the Read tool instead.
        if: github.event_name == 'issue_comment'
        env:
          BODY: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          printf '%s\n' "$BODY" > /tmp/iris-comment.txt
          printf '%s\n' "$AUTHOR" > /tmp/iris-comment-author.txt

      - name: Run iris
        id: iris
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          display_report: 'true'
          prompt: "/iris-review ${{ steps.pr.outputs.number }} --ci ${{ github.event_name }}"
          claude_args: >-
            ${{ vars.IRIS_MODEL != '' && format('--model {0}', vars.IRIS_MODEL) || '' }}
            ${{ vars.IRIS_EFFORT != '' && format('--effort {0}', vars.IRIS_EFFORT) || '' }}

      - name: Post review
        # The agent only writes /tmp/review.md — posting is the workflow's job,
        # so the footer is reliable and the comment count is exactly one.
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          EXEC_FILE: ${{ steps.iris.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          test -s /tmp/review.md
          model=$(jq -r 'first(.. | objects | select(has("model")) | .model) // empty' "$EXEC_FILE" || true)
          cost=$(jq -r 'first(.. | objects | select(has("total_cost_usd")) | .total_cost_usd) // empty' "$EXEC_FILE" || true)
          ms=$(jq -r 'first(.. | objects | select(has("duration_ms")) | .duration_ms) // empty' "$EXEC_FILE" || true)
          tin=$(jq -r 'first(.. | objects | select(has("total_cost_usd"))) | .usage.input_tokens // empty' "$EXEC_FILE" || true)
          tcache=$(jq -r 'first(.. | objects | select(has("total_cost_usd"))) | .usage
            | (.cache_read_input_tokens // 0) + (.cache_creation_input_tokens // 0)
            | if . > 0 then . else empty end' "$EXEC_FILE" || true)
          tout=$(jq -r 'first(.. | objects | select(has("total_cost_usd"))) | .usage.output_tokens // empty' "$EXEC_FILE" || true)
          tok() { if [ "$1" -ge 1000 ]; then echo "$(($1 / 1000))k"; else echo "$1"; fi; }
          footer="iris"
          [ -n "$model" ] && footer="$footer · $model"
          [ -n "$cost" ] && footer=$(printf '%s · $%.2f' "$footer" "$cost")
          [ -n "$ms" ] && footer="$footer · $((ms / 60000))m $((ms / 1000 % 60))s"
          [ -n "$tin" ] && footer="$footer · $(tok "$tin") in"
          [ -n "$tcache" ] && footer="$footer · $(tok "$tcache") cached"
          [ -n "$tout" ] && footer="$footer · $(tok "$tout") out"
          # The reviewed commit anchors the next re-review's delta diff.
          sha=$(git rev-parse --short HEAD || true)
          [ -n "$sha" ] && footer="$footer · reviewed $sha"
          printf '\n\n<sub>%s · [run](%s)</sub>\n' "$footer" "$RUN_URL" >> /tmp/review.md
          gh pr comment "$PR" -R "${{ github.repository }}" --body-file /tmp/review.md

      - name: Report failure
        # Without this, a failed run leaves the commenter waiting on a review
        # that never comes.
        if: failure() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh pr comment "$PR" -R "${{ github.repository }}" --body "iris failed — [run]($RUN_URL)"
