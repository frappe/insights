name: Generate Semantic Release
on:
  push:
    branches:
      - version-3

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
      - name: Setup dependencies
        # Pinned. Unpinned installs resolve the latest release on every run, so an
        # upstream publish breaks the workflow with no commit on our side. It happened
        # on 2026-08-24: conventionalcommits 10.4.0 needs conventional-changelog-writer
        # 9, which release-notes-generator 14 does not ship. Preset 10 renders an empty
        # body under writer 8, so the pin is on 9.
        run: |
          npm install --no-save \
            semantic-release@25.0.9 \
            @semantic-release/git@11.0.1 \
            @semantic-release/exec@7.1.0 \
            @semantic-release/release-notes-generator@14.1.1 \
            conventional-changelog-conventionalcommits@9.3.1
      - name: Record pre-release state
        id: pre_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          echo "tag=${PREV}" >> $GITHUB_OUTPUT
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no semantic-release
      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          PREV="${{ steps.pre_release.outputs.tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "$PREV" ]; then
            echo "No new release created, skipping."
            exit 0
          fi
          python3 .github/helpers/generate_release_notes.py \
            --repo "${{ github.repository }}" \
            --prev "$PREV" \
            --tag "$TAG" \
            --publish
