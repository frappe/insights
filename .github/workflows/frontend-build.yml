name: Frontend Build CI

on:
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  frontend-build-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Yarn
        run: npm install -g yarn

      # frontend/package.json links `@framework/ui` to a sibling frappe app, the
      # way a bench lays one out. Only the ui folder is read, so the clone takes
      # nothing else.
      - name: Fetch the frappe ui shim
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/frappe/frappe.git ../frappe
          git -C ../frappe sparse-checkout set ui

      - name: Install dependencies and build
        run: |
          yarn install
          yarn build
