name: Frontend Build CI

on:
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  frontend-build-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Yarn
        run: npm install -g yarn

      # `yarn lint` is the module boundaries and nothing else: what an island
      # entry may reach, and what a page shim may draw. Both are rules a build
      # cannot see, so they run beside it rather than after review.
      - name: Install dependencies and build
        run: |
          yarn install
          yarn lint
          yarn build
