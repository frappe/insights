name: Lint

on:
  pull_request:
    branches:
      - main
      - version-3
      - develop

concurrency:
  group: lint-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # One job, not one per check: each job takes a runner from the frappe org's shared pool.
  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # `@framework/ui` links to `../../frappe/ui`.
      - name: Check out frappe's UI package
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/frappe/frappe ../frappe
          git -C ../frappe sparse-checkout set ui

      - name: Install frontend dependencies
        run: yarn --cwd frontend install --frozen-lockfile

      - name: Install and Run Pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}

      - name: Check feature coverage
        if: ${{ !cancelled() }}
        run: python insights/tests/features.py check

      - name: Run Semgrep rules
        if: ${{ !cancelled() }}
        run: pre-commit run semgrep --hook-stage pre-push --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}

      # `frontend/e2e/AGENTS.md` tells an agent that lint refuses a sleep, a
      # conditional and `test.only`. This is what makes that true.
      - name: Lint the suite
        if: ${{ !cancelled() }}
        run: yarn --cwd frontend lint:e2e

      - name: Lint the app
        if: ${{ !cancelled() }}
        run: yarn --cwd frontend lint

      - name: Check commit titles
        if: ${{ !cancelled() }}
        run: |
          npm install --no-save --ignore-scripts @commitlint/cli @commitlint/config-conventional
          npx commitlint --verbose --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install and run pip-audit
        run: |
          pip install pip-audit
          pip-audit --desc on .
