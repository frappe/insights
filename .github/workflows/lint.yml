name: Lint

on:
  pull_request:
    branches:
      - main
      - version-3
      - develop

jobs:
  commit-lint:
    name: Semantic Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          check-latest: true
      - name: Check commit titles
        run: |
          npm install @commitlint/cli @commitlint/config-conventional
          npx commitlint --verbose --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # `@framework/ui` links to `../../frappe/ui`.
      - name: Check out frappe's UI package
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/frappe/frappe ../frappe
          git -C ../frappe sparse-checkout set ui

      - name: Install frontend dependencies
        run: yarn --cwd frontend install --frozen-lockfile

      - name: Install and Run Pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}

      - name: Check feature coverage
        run: python insights/tests/features.py check

      - name: Run Semgrep rules
        run: pre-commit run semgrep --hook-stage pre-push --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}

      # The hook above scans changed files only, so a rule change is checked against existing code here.
      - name: Scan the tree with the app's Semgrep rules
        run: |
          pip install semgrep==1.177.0
          semgrep --config .semgrep/insights.yml --error --metrics off --disable-version-check insights
