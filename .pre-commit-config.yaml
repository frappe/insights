exclude: 'node_modules/|\.git/'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, vue, scss]

  # Pre-push, not pre-commit: the rule files are fetched on every run, so it fails offline.
  # CI runs this hook too. Keep the list equal to every rule file under rules/ at the pin.
  # The baseline reports only findings the pushed commits introduce, as `semgrep ci` does.
  # It checks the baseline out in place, so parallel batches would scan each other's checkout.
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.177.0
    hooks:
      - id: semgrep
        name: Run Frappe semgrep rules
        stages: [pre-push]
        require_serial: true
        entry: bash -c 'SEMGREP_BASELINE_COMMIT="$PRE_COMMIT_FROM_REF" exec semgrep "$@"' --
        args:
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/b101a16e69df049b3fed1478bcc16223e957cca2/rules/code_quality.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/b101a16e69df049b3fed1478bcc16223e957cca2/rules/frappe_correctness.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/b101a16e69df049b3fed1478bcc16223e957cca2/rules/hooks.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/b101a16e69df049b3fed1478bcc16223e957cca2/rules/report.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/b101a16e69df049b3fed1478bcc16223e957cca2/rules/translate.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/b101a16e69df049b3fed1478bcc16223e957cca2/rules/ux.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/b101a16e69df049b3fed1478bcc16223e957cca2/rules/security/authorization.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/b101a16e69df049b3fed1478bcc16223e957cca2/rules/security/filesystem.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/b101a16e69df049b3fed1478bcc16223e957cca2/rules/security/format_string_injection.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/b101a16e69df049b3fed1478bcc16223e957cca2/rules/security/rce.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/b101a16e69df049b3fed1478bcc16223e957cca2/rules/security/sql.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/b101a16e69df049b3fed1478bcc16223e957cca2/rules/security/whitelisted.yml
          - --config=r/python.lang.correctness
          - --error
          - --disable-version-check
          - --quiet
          - --skip-unknown-extensions

  - repo: local
    hooks:
      - id: feature-coverage
        name: Check feature coverage
        entry: python insights/tests/features.py check
        language: python
        pass_filenames: false
        stages: [pre-push]
        files: ^(insights/.*test_.*\.py|frontend/(src2|e2e/tests)/.*\.(test|spec)\.ts|docs/(features|coverage)\.md|insights/tests/features\.py)$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
