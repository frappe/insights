exclude: 'node_modules/|\.git/'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, vue, scss]

  # Pre-push, not pre-commit: the rule files are fetched on every run, so it fails offline.
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.177.0
    hooks:
      - id: semgrep
        name: Run Frappe semgrep rules
        types: [python]
        stages: [pre-push]
        args:
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/b101a16e69df049b3fed1478bcc16223e957cca2/rules/frappe_correctness.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/b101a16e69df049b3fed1478bcc16223e957cca2/rules/code_quality.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/b101a16e69df049b3fed1478bcc16223e957cca2/rules/hooks.yml
          - --config=r/python.lang.correctness
          - --error
          - --disable-version-check
          - --quiet
          - --skip-unknown-extensions

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
