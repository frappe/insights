rules:
  # Semgrep matches a `try` by its exact shape, so each shape a handler sits in is a
  # pattern of its own. A handler in a `try` of three or more is not matched.
  - id: except-returns-default
    languages: [python]
    severity: ERROR
    message: >-
      This failure reaches the caller as a normal value. Handle the error, let it
      propagate, or end the line with `# nosemgrep - <why the default is the answer>`.
    paths:
      exclude:
        - /insights/patches/
        - /insights/tests/
        - test_*.py
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
              except ...:
                  $BODY
          - pattern: |
              try:
                  ...
              except ...:
                  $BODY
              else:
                  ...
          - pattern: |
              try:
                  ...
              except ...:
                  $BODY
              finally:
                  ...
          - pattern: |
              try:
                  ...
              except ...:
                  $BODY
              except ...:
                  ...
          - pattern: |
              try:
                  ...
              except ...:
                  ...
              except ...:
                  $BODY
      - metavariable-regex:
          metavariable: $BODY
          regex: ^(pass|return( None| \[\]| \{\}| False| 0)?)$
      - focus-metavariable: $BODY

  - id: patch-writes-without-controller
    languages: [python]
    severity: ERROR
    message: >-
      A patch that writes around the controller skips its validation and hooks, so the
      next change to the controller has to fix the patch too. Use `doc.insert()` or
      `doc.save()`.
    paths:
      include:
        - /insights/patches/
      exclude:
        # Sites upgrading from v2 still run it. It keeps the legacy timestamps that
        # `insert()` would overwrite, so it is left as it is.
        - /insights/patches/normalize_workbook.py
    pattern-either:
      - patterns:
          - pattern: $DOC.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(db_insert|db_update|db_set|before_validate|validate|before_save|after_save|before_insert|after_insert|on_update|before_submit|on_submit|before_cancel|on_cancel|on_trash|after_delete|before_rename|after_rename)$
      - patterns:
          - pattern: $DOC.run_method("$HOOK", ...)
          - metavariable-regex:
              metavariable: $HOOK
              regex: ^(before_validate|validate|before_save|after_save|before_insert|after_insert|on_update|before_submit|on_submit|before_cancel|on_cancel|on_trash|after_delete|before_rename|after_rename)$
